provider: routed_model
label:
  en_US: Routed Keyword Model
  zh_Hans: 关键词路由模型
description:
  en_US: Presents one logical chat model; routes each request to an admin-configured OpenAI-compatible upstream by deterministic keyword rules.
  zh_Hans: 对外呈现一个聊天模型；按确定性关键词规则将每次请求路由到管理员配置的 OpenAI 兼容上游。
icon_small:
  en_US: "icon.svg"
icon_large:
  en_US: "icon.svg"
background: "#0EA5E9"
help:
  title:
    en_US: Configuration guide
    zh_Hans: 配置说明
  url:
    en_US: https://github.com/yesgit/dify-routed-model#setup
    zh_Hans: https://github.com/yesgit/dify-routed-model/blob/main/readme/README_zh_Hans.md#%E9%85%8D%E7%BD%AE%E6%AD%A5%E9%AA%A4%E5%85%A8%E7%A8%8B%E6%97%A0-json
supported_model_types:
  - llm
configurate_methods:
  - customizable-model
extra:
  python:
    provider_source: provider/routed_model.py
    model_sources:
      - models/llm/llm.py
model_credential_schema:
  model:
    label:
      en_US: Logical model name
      zh_Hans: 逻辑模型名称
    placeholder:
      en_US: "e.g. routed-chat"
      zh_Hans: "例如 routed-chat"
  credential_form_schemas:
    # ============ 基础 ============
    - variable: mode
      type: select
      required: false
      default: chat
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Basics · Completion mode"
        zh_Hans: 基础 · 推理模式
      options:
        - value: chat
          label:
            en_US: Chat
            zh_Hans: 对话

    # ============ 上游提供商 ① —— 填了哪一组，哪一组生效；组内 Base URL 与模型清单必填 ============
    - variable: p1_name
      type: text-input
      required: false
      label:
        en_US: "P1 · Display name"
        zh_Hans: ① 提供商 · 名称
      placeholder:
        en_US: "e.g. tongyi"
        zh_Hans: "例如 tongyi"
    - variable: p1_base_url
      type: text-input
      required: false
      label:
        en_US: "P1 · Base URL (OpenAI-compatible)"
        zh_Hans: ① 提供商 · Base URL
      placeholder:
        en_US: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        zh_Hans: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    - variable: p1_key
      type: secret-input
      required: false
      label:
        en_US: "P1 · API key"
        zh_Hans: ① 提供商 · API Key
      placeholder:
        en_US: "Empty for no auth (local gateway)"
        zh_Hans: 留空 = 无鉴权（本地网关）
      help:
        en_US: Stored in the encrypted credential field; never appears in rules, responses or logs.
        zh_Hans: 存于密文凭据字段，不会出现在规则、响应或日志中。
    - variable: p1_models
      type: text-input
      required: false
      label:
        en_US: "P1 · Models: keywords"
        zh_Hans: ① 提供商 · 模型与关键词
      placeholder:
        en_US: "qwen-plus: 报价,合同; coder=qwen3-coder: 代码,refactor; glm-4"
        zh_Hans: "qwen-plus: 报价,合同; coder=qwen3-coder: 代码,refactor; glm-4"
      help:
        en_US: "[route-name=]model: kw1,kw2 ; model2 - semicolon separates entries, declaration order is priority (first hit wins). Use the route-name alias when two providers expose the same upstream model. Entries without keywords are fallback-only."
        zh_Hans: "格式“[路由名=]模型名: 关键词1,关键词2；模型2”。分号分隔条目，声明顺序即优先级（先命中先得）；不同提供商有同名模型时用“路由名=”起别名（路由名全局唯一，模型名可重复）；不带关键词的条目只作兜底目标；中英文标点均可。"

    # ============ 上游提供商 ② ============
    - variable: p2_name
      type: text-input
      required: false
      label:
        en_US: "P2 · Display name"
        zh_Hans: ② 提供商 · 名称
      placeholder:
        en_US: "e.g. private-gateway"
        zh_Hans: "例如 private-gateway"
    - variable: p2_base_url
      type: text-input
      required: false
      label:
        en_US: "P2 · Base URL"
        zh_Hans: ② 提供商 · Base URL
      placeholder:
        en_US: "https://llm.internal.example/v1"
        zh_Hans: "https://llm.internal.example/v1"
    - variable: p2_key
      type: secret-input
      required: false
      label:
        en_US: "P2 · API key"
        zh_Hans: ② 提供商 · API Key
      placeholder:
        en_US: "Empty for no auth (local gateway)"
        zh_Hans: 留空 = 无鉴权（本地网关）
    - variable: p2_models
      type: text-input
      required: false
      label:
        en_US: "P2 · Models: keywords"
        zh_Hans: ② 提供商 · 模型与关键词
      placeholder:
        en_US: "local=qwen-plus: legal,compliance; deepseek-r1"
        zh_Hans: "local=qwen-plus: 合规,审计; deepseek-r1"
      help:
        en_US: Same syntax as P1.
        zh_Hans: 语法同 ① 提供商。

    # ============ 上游提供商 ③ ============
    - variable: p3_name
      type: text-input
      required: false
      label:
        en_US: "P3 · Display name"
        zh_Hans: ③ 提供商 · 名称
      placeholder:
        en_US: "e.g. moonshot"
        zh_Hans: "例如 moonshot"
    - variable: p3_base_url
      type: text-input
      required: false
      label:
        en_US: "P3 · Base URL"
        zh_Hans: ③ 提供商 · Base URL
      placeholder:
        en_US: "https://api.example.com/v1"
        zh_Hans: "https://api.example.com/v1"
    - variable: p3_key
      type: secret-input
      required: false
      label:
        en_US: "P3 · API key"
        zh_Hans: ③ 提供商 · API Key
      placeholder:
        en_US: "Empty for no auth (local gateway)"
        zh_Hans: 留空 = 无鉴权（本地网关）
    - variable: p3_models
      type: text-input
      required: false
      label:
        en_US: "P3 · Models: keywords"
        zh_Hans: ③ 提供商 · 模型与关键词
      placeholder:
        en_US: "kimi-k2: math,reasoning; vl=gpt-4o"
        zh_Hans: "kimi-k2: 数学,推理; vl=gpt-4o"
      help:
        en_US: Same syntax as P1.
        zh_Hans: 语法同 ① 提供商。

    # ============ 上游提供商 ④ ============
    - variable: p4_name
      type: text-input
      required: false
      label:
        en_US: "P4 · Display name"
        zh_Hans: ④ 提供商 · 名称
      placeholder:
        en_US: "e.g. openai-compatible"
        zh_Hans: "例如 openai-compatible"
    - variable: p4_base_url
      type: text-input
      required: false
      label:
        en_US: "P4 · Base URL"
        zh_Hans: ④ 提供商 · Base URL
      placeholder:
        en_US: "https://gateway.example.com/v1"
        zh_Hans: "https://gateway.example.com/v1"
    - variable: p4_key
      type: secret-input
      required: false
      label:
        en_US: "P4 · API key"
        zh_Hans: ④ 提供商 · API Key
      placeholder:
        en_US: "Empty for no auth (local gateway)"
        zh_Hans: 留空 = 无鉴权（本地网关）
    - variable: p4_models
      type: text-input
      required: false
      label:
        en_US: "P4 · Models: keywords"
        zh_Hans: ④ 提供商 · 模型与关键词
      placeholder:
        en_US: "gpt-4o: 架构,设计; backup=glm-4"
        zh_Hans: "gpt-4o: 架构,设计; backup=glm-4"
      help:
        en_US: Same syntax as P1.
        zh_Hans: 语法同 ① 提供商。

    # ============ 路由策略 ============
    - variable: default_target
      type: text-input
      required: true
      label:
        en_US: "Routing · Fallback target (route name when no keyword hits)"
        zh_Hans: 路由 · 兜底目标（路由名）
      placeholder:
        en_US: "e.g. qwen-plus"
        zh_Hans: "例如 qwen-plus"
      help:
        en_US: Route name (alias, or model name if no alias) used when no keyword matches.
        zh_Hans: 任何关键词都未命中时使用的路由名（别名，或未起别名时的模型名）。
    - variable: uncheck_policy
      type: select
      required: false
      default: default_route
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Routing · Policy for non-checkable content"
        zh_Hans: 路由 · 未知内容策略
      help:
        en_US: >-
          Applies ONLY when a request contains segments that cannot be keyword-checked
          (images, audio, files); for pure-text requests all three options behave
          identically. "Keep normal routing" = ignore those segments, the remaining
          text is matched as usual (rule hit wins, otherwise fallback). "Force a fixed
          target" = keywords no longer matter: as soon as ONE un-checkable segment
          exists the request goes to the route name below — the fixed target outranks
          keyword matching, so use it to funnel all attachment traffic into one
          capable target (e.g. a vision model). "Reject" = fail the request with an
          explicit error, nothing is sent upstream. With the debug log on, reason=
          shows which path was taken: rule:<id> / default / unknown_fixed_target.
        zh_Hans: >-
          仅当请求中出现无法按文本检查的内容段（图片、音频、文件等）时才生效；纯文本请求下三种设置行为完全一致。
          照常路由 = 忽略这些段，其余文本照常匹配关键词（命中走该规则，未命中走兜底）；
          固定目标 = 不再看关键词，只要含一个不可检段就无条件走下一字段指定的路由名——固定目标优先于关键词匹配，
          适合把带附件的请求统一收口到一个能处理的目标（如多模态模型）；
          拒绝请求 = 显式报错，不发往任何上游。开启调试日志后可用 reason= 区分走了哪条路径：
          rule:<id> / default / unknown_fixed_target。
      options:
        - value: default_route
          label:
            en_US: Keep normal routing
            zh_Hans: 照常路由
        - value: reject
          label:
            en_US: Reject the request
            zh_Hans: 拒绝请求
        - value: fixed_target
          label:
            en_US: Force a fixed target
            zh_Hans: 固定目标
    - variable: uncheck_target
      type: text-input
      required: false
      show_on:
        - variable: uncheck_policy
          value: fixed_target
      label:
        en_US: "Routing · Fixed target route name"
        zh_Hans: 路由 · 固定目标（路由名）
      placeholder:
        en_US: "e.g. qwen-plus"
        zh_Hans: "例如 qwen-plus"
      help:
        en_US: >-
          Shown and used only when the policy above is "Force a fixed target": any
          request containing at least one un-checkable segment is routed here
          regardless of keyword hits. Pure-text requests never use this field.
        zh_Hans: 仅当上方“未知内容策略”选择固定目标时显示并生效：请求只要含任一不可检内容段（图片、音频、文件等）就无条件走到这里填的路由名，不看关键词；纯文本请求永远不会用到此项。
    - variable: connectivity_check
      type: select
      required: false
      default: ping_all
      label:
        en_US: "Routing · Save-time connectivity check"
        zh_Hans: 路由 · 保存时连通性校验
      help:
        en_US: ping all = every target must answer a minimal ping at save time (a few tokens each); ping default = only the fallback target is checked; parse only = no network check at save, unreachable targets surface on first routed request. Does not affect runtime routing.
        zh_Hans: 全部目标 = 保存时向每个目标发一次最小 ping（各消耗几 token），任一失败拒绝保存；仅兜底目标 = 只校验兜底目标；仅配置检查 = 不联网，不可达目标在首次被路由到时才报错。该选项不影响运行时路由行为。
      options:
        - value: ping_all
          label:
            en_US: Ping all targets
            zh_Hans: 全部目标
        - value: ping_default
          label:
            en_US: Only the fallback target
            zh_Hans: 仅兜底目标
        - value: parse_only
          label:
            en_US: Parse config only (no network)
            zh_Hans: 仅配置检查
    - variable: debug_log
      type: select
      required: false
      default: "off"
      label:
        en_US: "Routing · Decision debug log"
        zh_Hans: 路由 · 决策调试日志
      help:
        en_US: >-
          With "record decisions", each request writes one line to the plugin daemon log
          (docker logs / plugin container, admin-only): logical model, route name, hit
          reason, stream flag, message and char counts — never prompt content, keys or
          URLs. Turn off after debugging.
        zh_Hans: 选“记录决策”后，每次请求向插件 daemon 日志（docker logs，仅管理员可见）写一行决策元数据：逻辑模型名、路由名、命中原因、是否流式、消息条数与字符数——绝不含 prompt 内容、密钥与 URL。排障完建议关回“关闭”。
      options:
        - value: "off"
          label:
            en_US: "Off"
            zh_Hans: 关闭
        - value: routing
          label:
            en_US: Record decisions (admin logs)
            zh_Hans: 记录决策
    # ============ 能力声明（按所有路由目标中最弱的一方填写） ============
    - variable: vision_support
      type: select
      required: false
      default: no_support
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Capabilities · Vision"
        zh_Hans: 能力 · 视觉支持
      help:
        en_US: Declare support only if EVERY routed target accepts images.
        zh_Hans: 仅当所有路由目标都支持图片时才声明支持。
      options:
        - value: support
          label:
            en_US: Support
            zh_Hans: 支持
        - value: no_support
          label:
            en_US: Not Support
            zh_Hans: 不支持
    - variable: function_calling_type
      type: select
      required: false
      default: no_call
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Capabilities · Function calling"
        zh_Hans: 能力 · 函数调用
      help:
        en_US: tool_call forwards Dify tool definitions as OpenAI-style tools (recommended for agents).
        zh_Hans: “工具调用”按 OpenAI tools 透传 Dify 工具定义（Agent 场景推荐）。
      options:
        - value: no_call
          label:
            en_US: Not supported
            zh_Hans: 不支持
        - value: function_call
          label:
            en_US: "Legacy function call"
            zh_Hans: 旧式 function call
        - value: tool_call
          label:
            en_US: Tool call
            zh_Hans: 工具调用
    - variable: stream_function_calling
      type: select
      required: false
      default: not_supported
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Capabilities · Streaming function calling"
        zh_Hans: 能力 · 流式函数调用
      options:
        - value: supported
          label:
            en_US: Support
            zh_Hans: 支持
        - value: not_supported
          label:
            en_US: Not Support
            zh_Hans: 不支持
    - variable: agent_thought_support
      type: select
      required: false
      default: not_supported
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Capabilities · Agent thought"
        zh_Hans: 能力 · 智能体思考
      options:
        - value: supported
          label:
            en_US: Support
            zh_Hans: 支持
        - value: not_supported
          label:
            en_US: Not Support
            zh_Hans: 不支持
    - variable: structured_output_support
      type: select
      required: false
      default: not_supported
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Capabilities · Structured output"
        zh_Hans: 能力 · 结构化输出
      options:
        - value: supported
          label:
            en_US: Support
            zh_Hans: 支持
        - value: not_supported
          label:
            en_US: Not Support
            zh_Hans: 不支持

    # ============ 容量与超时 ============
    - variable: context_size
      type: text-input
      required: true
      default: "4096"
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Capacity · Context size"
        zh_Hans: 容量 · 上下文长度
      placeholder:
        en_US: smallest among routed targets
        zh_Hans: 填各路由目标中最小值
    - variable: max_tokens_to_sample
      type: text-input
      required: true
      default: "4096"
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: "Capacity · Maximum output tokens"
        zh_Hans: 容量 · 最大输出 token
      placeholder:
        en_US: smallest among routed targets
        zh_Hans: 填各路由目标中最小值
    - variable: connect_timeout
      type: text-input
      required: false
      default: "10"
      label:
        en_US: "Timeout · Connect (s)"
        zh_Hans: 超时 · 连接（秒）
    - variable: read_timeout
      type: text-input
      required: false
      default: "120"
      label:
        en_US: "Timeout · Read (s)"
        zh_Hans: 超时 · 读取（秒）
