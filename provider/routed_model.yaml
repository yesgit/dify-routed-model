provider: routed_model
label:
  en_US: Routed Keyword Model
  zh_Hans: 关键词路由模型
description:
  en_US: Presents one logical chat model; routes each request to an admin-configured OpenAI-compatible upstream by deterministic keyword rules.
  zh_Hans: 对外呈现一个聊天模型；按确定性关键词规则将每次请求路由到管理员配置的 OpenAI 兼容上游。
icon_small:
  en_US: "icon.svg"
icon_large:
  en_US: "icon.svg"
background: "#0EA5E9"
help:
  title:
    en_US: Configuration guide
    zh_Hans: 配置说明
  tip:
    en_US: >-
      Up to 4 upstream providers; each provider has name / base_url / API key and a
      models list like "qwen-plus: 报价,合同; glm-4" (model: keywords, semicolon
      separated, declaration order = priority, first hit wins). Requests with no keyword
      hit go to default_target. API keys live only in each provider's secret field.
      Real upstream model names stay server-side; end users see only the logical model.
      Keyword routing is business classification, not a security boundary. Saving
      validates every model with one minimal chat request. Details in the plugin README.
    zh_Hans: >-
      最多 4 个上游 provider；每个 provider 填名称 / base_url / API Key 和模型清单，
      形如 "qwen-plus: 报价,合同; glm-4"（模型: 关键词，分号分隔，声明顺序即优先级，
      先命中先得）。未命中关键词的请求走 default_target。密钥只存在于各 provider 的
      密文字段。上游真实模型名只在服务端可见，最终用户只看到一个逻辑模型。关键词路由
      用于业务分流，不构成安全边界。保存时会对每个模型发起一次最小连通性请求。
      详见插件 README。
supported_model_types:
  - llm
configurate_methods:
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Logical model name
      zh_Hans: 逻辑模型名称
    placeholder:
      en_US: "e.g. routed-chat"
      zh_Hans: "例如 routed-chat"
  credential_form_schemas:
    - variable: mode
      type: select
      required: false
      default: chat
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Completion mode
        zh_Hans: 对话类型
      options:
        - value: chat
          label:
            en_US: Chat
            zh_Hans: 对话

    # ---- Provider slots 1..4 --------------------------------------------
    - variable: p1_name
      type: text-input
      required: false
      label:
        en_US: "Provider 1 - display name"
        zh_Hans: 提供商 1 - 名称
      placeholder:
        en_US: "e.g. tongyi"
        zh_Hans: "例如 tongyi"
    - variable: p1_base_url
      type: text-input
      required: false
      label:
        en_US: "Provider 1 - base URL (OpenAI-compatible)"
        zh_Hans: 提供商 1 - base_url（OpenAI 兼容）
      placeholder:
        en_US: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        zh_Hans: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    - variable: p1_key
      type: secret-input
      required: false
      label:
        en_US: "Provider 1 - API key"
        zh_Hans: 提供商 1 - API Key
      placeholder:
        en_US: "Empty for no auth (local gateway)"
        zh_Hans: 留空表示无鉴权（本地网关）
      help:
        en_US: Stored in the encrypted credential field; never appears in rules, responses or logs.
        zh_Hans: 存于密文凭据字段；不会出现在规则、响应或日志中。
    - variable: p1_models
      type: text-input
      required: false
      label:
        en_US: "Provider 1 - models: keywords; models"
        zh_Hans: "提供商 1 - 模型: 关键词; 其他模型"
      placeholder:
        en_US: "qwen-plus: 报价,合同; qwen3-coder: 代码,refactor; glm-4"
        zh_Hans: "qwen-plus: 报价,合同; qwen3-coder: 代码,refactor; glm-4"
      help:
        en_US: "Format model: kw1,kw2; model2: kw; model3 - semicolon splits entries, declaration order is priority (first hit wins). Entries without keywords act as fallback-only targets. Comma and ; : may be full-width."
        zh_Hans: "格式“模型: 关键词1,关键词2; 模型2: 关键词; 模型3”。分号分隔条目，声明顺序即优先级（先命中先得）；不带关键词的条目只作为兜底目标；中英文逗号、分号、冒号均可。"
    - variable: p2_name
      type: text-input
      required: false
      label:
        en_US: "Provider 2 - display name"
        zh_Hans: 提供商 2 - 名称
    - variable: p2_base_url
      type: text-input
      required: false
      label:
        en_US: "Provider 2 - base URL (OpenAI-compatible)"
        zh_Hans: 提供商 2 - base_url（OpenAI 兼容）
    - variable: p2_key
      type: secret-input
      required: false
      label:
        en_US: "Provider 2 - API key"
        zh_Hans: 提供商 2 - API Key
    - variable: p2_models
      type: text-input
      required: false
      label:
        en_US: "Provider 2 - models: keywords; models"
        zh_Hans: "提供商 2 - 模型: 关键词; 其他模型"
    - variable: p3_name
      type: text-input
      required: false
      label:
        en_US: "Provider 3 - display name"
        zh_Hans: 提供商 3 - 名称
    - variable: p3_base_url
      type: text-input
      required: false
      label:
        en_US: "Provider 3 - base URL (OpenAI-compatible)"
        zh_Hans: 提供商 3 - base_url（OpenAI 兼容）
    - variable: p3_key
      type: secret-input
      required: false
      label:
        en_US: "Provider 3 - API key"
        zh_Hans: 提供商 3 - API Key
    - variable: p3_models
      type: text-input
      required: false
      label:
        en_US: "Provider 3 - models: keywords; models"
        zh_Hans: "提供商 3 - 模型: 关键词; 其他模型"
    - variable: p4_name
      type: text-input
      required: false
      label:
        en_US: "Provider 4 - display name"
        zh_Hans: 提供商 4 - 名称
    - variable: p4_base_url
      type: text-input
      required: false
      label:
        en_US: "Provider 4 - base URL (OpenAI-compatible)"
        zh_Hans: 提供商 4 - base_url（OpenAI 兼容）
    - variable: p4_key
      type: secret-input
      required: false
      label:
        en_US: "Provider 4 - API key"
        zh_Hans: 提供商 4 - API Key
    - variable: p4_models
      type: text-input
      required: false
      label:
        en_US: "Provider 4 - models: keywords; models"
        zh_Hans: "提供商 4 - 模型: 关键词; 其他模型"

    - variable: default_target
      type: text-input
      required: true
      label:
        en_US: Default target (model name when no keyword hits)
        zh_Hans: 默认目标（未命中关键词时使用的模型名）
      placeholder:
        en_US: "e.g. qwen-plus"
        zh_Hans: "例如 qwen-plus"

    - variable: uncheck_policy
      type: select
      required: false
      default: default_route
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: When the request contains content that cannot be keyword-checked
        zh_Hans: 请求含无法按文本检查的内容时
      help:
        en_US: default_route falls through to normal matching (default target if no keyword hits); reject fails the request with an explicit error; fixed_target always goes to the model named in the next field.
        zh_Hans: default_route 照常走规则与默认目标；reject 直接报错拒绝；fixed_target 固定使用下一字段指定的模型。
      options:
        - value: default_route
          label:
            en_US: "Default: keep normal routing"
            zh_Hans: "默认：照常路由"
        - value: reject
          label:
            en_US: "Reject the request"
            zh_Hans: 拒绝请求
        - value: fixed_target
          label:
            en_US: "Force a fixed target"
            zh_Hans: 固定目标
    - variable: uncheck_target
      type: text-input
      required: false
      label:
        en_US: Model used when policy is fixed_target
        zh_Hans: fixed_target 策略使用的模型名
      placeholder:
        en_US: "e.g. qwen-plus"
        zh_Hans: "例如 qwen-plus"

    # ---- Capability declarations -----------------------------------------
    - variable: vision_support
      type: select
      required: false
      default: no_support
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Vision support
        zh_Hans: 视觉支持
      help:
        en_US: Declare support only if EVERY routed target can accept images.
        zh_Hans: 仅当所有路由目标都支持图片时才声明支持。
      options:
        - value: support
          label:
            en_US: Support
            zh_Hans: 支持
        - value: no_support
          label:
            en_US: Not Support
            zh_Hans: 不支持
    - variable: function_calling_type
      type: select
      required: false
      default: no_call
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Function calling type
        zh_Hans: 函数调用类型
      help:
        en_US: tool_call forwards Dify tool definitions as OpenAI-style tools (recommended when using agents).
        zh_Hans: tool_call 会将 Dify 工具定义按 OpenAI tools 透传（使用 Agent 时推荐）。
      options:
        - value: no_call
          label:
            en_US: Not supported
            zh_Hans: 不支持
        - value: function_call
          label:
            en_US: "Legacy function call"
            zh_Hans: 旧式 function call
        - value: tool_call
          label:
            en_US: Tool call
            zh_Hans: 工具调用
    - variable: stream_function_calling
      type: select
      required: false
      default: not_supported
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Streaming function calling
        zh_Hans: 流式函数调用
      options:
        - value: supported
          label:
            en_US: Support
            zh_Hans: 支持
        - value: not_supported
          label:
            en_US: Not Support
            zh_Hans: 不支持
    - variable: agent_thought_support
      type: select
      required: false
      default: not_supported
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Agent thought
        zh_Hans: 智能体思考
      options:
        - value: supported
          label:
            en_US: Support
            zh_Hans: 支持
        - value: not_supported
          label:
            en_US: Not Support
            zh_Hans: 不支持
    - variable: structured_output_support
      type: select
      required: false
      default: not_supported
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Structured output
        zh_Hans: 结构化输出
      options:
        - value: supported
          label:
            en_US: Support
            zh_Hans: 支持
        - value: not_supported
          label:
            en_US: Not Support
            zh_Hans: 不支持
    - variable: context_size
      type: text-input
      required: true
      default: "4096"
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      placeholder:
        en_US: Enter the smallest context among routed targets
        zh_Hans: 填写各路由目标中最小的上下文长度
    - variable: max_tokens_to_sample
      type: text-input
      required: true
      default: "4096"
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Maximum output tokens
        zh_Hans: 最大输出 token
      placeholder:
        en_US: Enter the smallest output limit among routed targets
        zh_Hans: 填写各路由目标中最小的输出上限

    # ---- HTTP timeouts -----------------------------------------------------
    - variable: connect_timeout
      type: text-input
      required: false
      default: "10"
      label:
        en_US: Connect timeout (seconds)
        zh_Hans: 连接超时（秒）
    - variable: read_timeout
      type: text-input
      required: false
      default: "120"
      label:
        en_US: Read timeout (seconds)
        zh_Hans: 读取超时（秒）
